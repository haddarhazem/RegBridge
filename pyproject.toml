[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regbridge"
version = "0.1.0"
description = "Technical baseline for the RegBridge modular monolith."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "boto3>=1.35,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "mistralai>=2.7,<3.0",
  "qdrant-client>=1.18,<2.0",
  "transformers>=5.0,<6.0",
  "torch>=2.0,<3.0",
  "fpdf2>=2.8,<3.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]
research = [
  "langgraph==1.2.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
