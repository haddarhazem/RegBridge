services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: regbridge
      POSTGRES_USER: regbridge
      POSTGRES_PASSWORD: regbridge
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - regbridge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regbridge -d regbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - regbridge-minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 local-access-key local-secret-key; do sleep 1; done; mc mb --ignore-existing local/regbridge-documents; mc anonymous set none local/regbridge-documents"

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - regbridge-clamav-data:/var/lib/clamav

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm --hostname=http://127.0.0.1:18080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./infra/keycloak/regbridge-realm.json:/opt/keycloak/data/import/regbridge-realm.json:ro
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/regbridge/.well-known/openid-configuration HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '200' <&3
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  regbridge-postgres-data:
  regbridge-minio-data:
  regbridge-clamav-data:
